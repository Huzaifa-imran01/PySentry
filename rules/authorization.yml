rules:
- id: csrf-protection-disabled
  languages:
  - python
  severity: WARNING
  message: 'authorization: review this security-sensitive operation; exploitability
    depends on context.'
  metadata:
    category: security
    confidence: MEDIUM
    scope: Python/Flask/Django; local intraprocedural analysis
    origin: project-authored
  pattern: "@django.views.decorators.csrf.csrf_exempt\ndef $F(...):\n    ..."
