rules:
- id: framework-yaml
  languages:
  - python
  severity: WARNING
  message: Review request-controlled data reaching this yaml operation.
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-inside: '$APP = fastapi.FastAPI(...)

        ...'
    - pattern-inside: "@$APP.$M(...)\ndef $F(..., $P: $T, ...):\n    ..."
    - metavariable-regex:
        metavariable: $M
        regex: ^(get|post|put|patch|delete)$
    - metavariable-regex:
        metavariable: $T
        regex: ^(str|bytes|int|float|dict|list)$
    - pattern: $P
  - patterns:
    - pattern-inside: '$APP = fastapi.APIRouter(...)

        ...'
    - pattern-inside: "@$APP.$M(...)\ndef $F(..., $P: $T, ...):\n    ..."
    - metavariable-regex:
        metavariable: $M
        regex: ^(get|post|put|patch|delete)$
    - metavariable-regex:
        metavariable: $T
        regex: ^(str|bytes|int|float|dict|list)$
    - pattern: $P
  - patterns:
    - pattern-inside: "def $FUNC(..., $R: starlette.requests.Request, ...):\n    ..."
    - pattern: $R.query_params.get(...)
  - patterns:
    - pattern-inside: "def $FUNC(..., $R: starlette.requests.Request, ...):\n    ..."
    - pattern: $R.query_params[...]
  - patterns:
    - pattern-inside: "def $FUNC(..., $R: starlette.requests.Request, ...):\n    ..."
    - pattern: $R.path_params[...]
  - patterns:
    - pattern-inside: "def $FUNC(..., $R: starlette.requests.Request, ...):\n    ..."
    - pattern: $R.json()
  - patterns:
    - pattern-inside: "def $FUNC(..., $R: starlette.requests.Request, ...):\n    ..."
    - pattern: $R.body()
  - patterns:
    - pattern-inside: "def $FUNC(..., $R: starlette.requests.Request, ...):\n    ..."
    - pattern: $R.form()
  - patterns:
    - pattern-inside: "def $FUNC(..., $F: fastapi.UploadFile, ...):\n    ..."
    - pattern: $F.read(...)
  - patterns:
    - pattern-inside: "def $FUNC(..., $R: fastapi.Request, ...):\n    ..."
    - pattern: $R.query_params.get(...)
  - patterns:
    - pattern-inside: "def $FUNC(..., $R: fastapi.Request, ...):\n    ..."
    - pattern: $R.query_params[...]
  - patterns:
    - pattern-inside: "def $FUNC(..., $R: fastapi.Request, ...):\n    ..."
    - pattern: $R.path_params[...]
  - patterns:
    - pattern-inside: "def $FUNC(..., $R: fastapi.Request, ...):\n    ..."
    - pattern: $R.body()
  - patterns:
    - pattern-inside: "def $FUNC(..., $R: fastapi.Request, ...):\n    ..."
    - pattern: $R.json()
  - patterns:
    - pattern-inside: "def $FUNC(..., $R: fastapi.Request, ...):\n    ..."
    - pattern: $R.form()
  - patterns:
    - pattern-inside: '$APP = fastapi.FastAPI(...)

        ...'
    - metavariable-regex:
        metavariable: $M
        regex: ^(get|post|put|patch|delete)$
    - pattern-inside: "@$APP.$M(...)\ndef $F(..., $P: $T = fastapi.Form(...), ...):\n\
        \    ..."
    - pattern: $P
  - patterns:
    - pattern-inside: '$APP = fastapi.FastAPI(...)

        ...'
    - metavariable-regex:
        metavariable: $M
        regex: ^(get|post|put|patch|delete)$
    - pattern-inside: "@$APP.$M(...)\ndef $F(..., $P: $T = fastapi.Body(...), ...):\n\
        \    ..."
    - pattern: $P
  - patterns:
    - pattern-inside: '$APP = fastapi.FastAPI(...)

        ...'
    - metavariable-regex:
        metavariable: $M
        regex: ^(get|post|put|patch|delete)$
    - pattern-inside: "@$APP.$M(...)\ndef $F(..., $P: $T = fastapi.Query(...), ...):\n\
        \    ..."
    - pattern: $P
  - patterns:
    - pattern-inside: '$APP = fastapi.FastAPI(...)

        ...'
    - metavariable-regex:
        metavariable: $M
        regex: ^(get|post|put|patch|delete)$
    - pattern-inside: "@$APP.$M(...)\ndef $F(..., $P: $T = fastapi.Path(...), ...):\n\
        \    ..."
    - pattern: $P
  - patterns:
    - pattern-inside: '$APP = fastapi.FastAPI(...)

        ...'
    - metavariable-regex:
        metavariable: $M
        regex: ^(get|post|put|patch|delete)$
    - pattern-inside: "class $BODY(pydantic.BaseModel):\n    ...\n..."
    - pattern-inside: "@$APP.$M(...)\ndef $F(..., $P: $BODY, ...):\n    ..."
    - pattern: $P.$FIELD
  - patterns:
    - pattern-inside: '$APP = fastapi.APIRouter(...)

        ...'
    - metavariable-regex:
        metavariable: $M
        regex: ^(get|post|put|patch|delete)$
    - pattern-inside: "@$APP.$M(...)\ndef $F(..., $P: $T = fastapi.Form(...), ...):\n\
        \    ..."
    - pattern: $P
  - patterns:
    - pattern-inside: '$APP = fastapi.APIRouter(...)

        ...'
    - metavariable-regex:
        metavariable: $M
        regex: ^(get|post|put|patch|delete)$
    - pattern-inside: "@$APP.$M(...)\ndef $F(..., $P: $T = fastapi.Body(...), ...):\n\
        \    ..."
    - pattern: $P
  - patterns:
    - pattern-inside: '$APP = fastapi.APIRouter(...)

        ...'
    - metavariable-regex:
        metavariable: $M
        regex: ^(get|post|put|patch|delete)$
    - pattern-inside: "@$APP.$M(...)\ndef $F(..., $P: $T = fastapi.Query(...), ...):\n\
        \    ..."
    - pattern: $P
  - patterns:
    - pattern-inside: '$APP = fastapi.APIRouter(...)

        ...'
    - metavariable-regex:
        metavariable: $M
        regex: ^(get|post|put|patch|delete)$
    - pattern-inside: "@$APP.$M(...)\ndef $F(..., $P: $T = fastapi.Path(...), ...):\n\
        \    ..."
    - pattern: $P
  - patterns:
    - pattern-inside: '$APP = fastapi.APIRouter(...)

        ...'
    - metavariable-regex:
        metavariable: $M
        regex: ^(get|post|put|patch|delete)$
    - pattern-inside: "class $BODY(pydantic.BaseModel):\n    ...\n..."
    - pattern-inside: "@$APP.$M(...)\ndef $F(..., $P: $BODY, ...):\n    ..."
    - pattern: $P.$FIELD
  pattern-sinks:
  - patterns:
    - pattern: yaml.unsafe_load($X)
    - focus-metavariable: $X
  - patterns:
    - pattern: yaml.load($X, Loader=yaml.UnsafeLoader)
    - focus-metavariable: $X
