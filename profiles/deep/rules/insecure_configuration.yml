rules:
- id: django-debug-enabled
  languages:
  - python
  severity: WARNING
  message: 'insecure_configuration: review this security-sensitive operation; exploitability
    depends on context.'
  metadata:
    category: security
    confidence: MEDIUM
    scope: Python/Flask/Django; local intraprocedural analysis
    origin: project-authored
  pattern: DEBUG = True
