rules:
- id: hardcoded-password
  languages:
  - python
  severity: WARNING
  message: 'credentials: review this security-sensitive operation; exploitability
    depends on context.'
  metadata:
    category: security
    confidence: MEDIUM
    scope: Python/Flask/Django; local intraprocedural analysis
    origin: project-authored
  patterns:
  - pattern: $NAME = "$VALUE"
  - metavariable-regex:
      metavariable: $NAME
      regex: (?i)^(password|passwd|secret_key)$
